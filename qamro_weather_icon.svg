<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#075985" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- sun rays -->
  <g stroke="#FDE68A" stroke-width="10" stroke-linecap="round">
    <line x1="164" y1="36" x2="164" y2="54"/>
    <line x1="212" y1="56" x2="199" y2="69"/>
    <line x1="228" y1="104" x2="210" y2="104"/>
    <line x1="116" y1="56" x2="129" y2="69"/>
  </g>

  <!-- sun -->
  <circle cx="164" cy="104" r="40" fill="url(#sun)"/>

  <!-- cloud -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <circle cx="94" cy="156" r="34"/>
    <circle cx="134" cy="140" r="42"/>
    <circle cx="178" cy="162" r="30"/>
    <rect x="62" y="156" width="146" height="36" rx="18"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
